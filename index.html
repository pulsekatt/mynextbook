<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a2e" />
    
    <!-- Primary SEO -->
    <title>My Next Book — Free AI Book Recommendations</title>
    <meta name="description" content="Get personalized book recommendations from AI. Tell us what you loved reading and discover your next favorite. Free, no signup required." />
    <meta name="keywords" content="book recommendations, AI book finder, what to read next, personalized books, free book suggestions, AI book recommender" />
    <meta name="author" content="My Next Book" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://mynextbook.io/" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, iMessage, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="My Next Book" />
    <meta property="og:url" content="https://mynextbook.io/" />
    <meta property="og:title" content="My Next Book — Free AI Book Recommendations" />
    <meta property="og:description" content="Get personalized book recommendations from AI. Tell us what you loved reading and discover your next favorite. Free, no signup required." />
    <meta property="og:image" content="https://mynextbook.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="My Next Book — AI-powered, no login, 100% free book recommendations" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="My Next Book — Free AI Book Recommendations" />
    <meta name="twitter:description" content="Get personalized book recommendations from AI. Tell us what you loved reading and discover your next favorite. Free, no signup required." />
    <meta name="twitter:image" content="https://mynextbook.io/og-image.png" />
    <meta name="twitter:image:alt" content="My Next Book — AI-powered book recommendations" />
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "My Next Book",
      "url": "https://mynextbook.io",
      "description": "AI-powered book recommendation tool. Tell us what you've loved reading and discover your next favorite book.",
      "applicationCategory": "BookApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "AI-powered book recommendations",
        "Personalized suggestions based on your reading history",
        "No signup required",
        "Free to use"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
