<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a2e" />

    <!-- Primary SEO -->
    <title>My Next Book — Find Your Next Favorite Read</title>
    <meta name="description" content="Tell us a few books you've read and loved, and get personalized recommendations for what to read next — with covers, descriptions, and why each fits your taste. Free, no signup, no ads." />
    <meta name="keywords" content="book recommendations, what to read next, what should I read next, personalized book suggestions, find your next book, free book recommendations, reading recommendations" />
    <meta name="author" content="My Next Book" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://mynextbook.io/" />

    <!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
<link rel="apple-touch-icon" href="/favicon-512.png" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, iMessage, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="My Next Book" />
    <meta property="og:url" content="https://mynextbook.io/" />
    <meta property="og:title" content="My Next Book — Find Your Next Favorite Read" />
    <meta property="og:description" content="Tell us a few books you've read and loved, and get personalized recommendations for what to read next — with covers, descriptions, and why each fits your taste. Free, no signup, no ads." />
    <meta property="og:image" content="https://mynextbook.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="My Next Book — personalized book recommendations, no login, 100% free" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="My Next Book — Find Your Next Favorite Read" />
    <meta name="twitter:description" content="Tell us a few books you've read and loved, and get personalized recommendations for what to read next — with covers, descriptions, and why each fits your taste. Free, no signup, no ads." />
    <meta name="twitter:image" content="https://mynextbook.io/og-image.png" />
    <meta name="twitter:image:alt" content="My Next Book — personalized book recommendations" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "My Next Book",
      "url": "https://mynextbook.io",
      "description": "Tell us a few books you've read and loved, and get personalized recommendations for what to read next, with covers, descriptions, and why each fits your taste.",
      "applicationCategory": "BookApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Personalized book recommendations",
        "Suggestions based on books you've already loved",
        "Covers and descriptions for every pick",
        "No signup required",
        "Free to use"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
